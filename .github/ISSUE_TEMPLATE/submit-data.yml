# Generated by scripts/gen-issue-template.mjs from src/data/categories.yaml and src/locales/en-US/data.yml. Do not edit by hand.
# After changing cost items, run: pnpm run issue-template
name: Submit my data
description: Share what you actually pay in Seattle to add a reference data set.
title: "[Data] "
labels:
  - data-submission
body:
  - type: markdown
    attributes:
      value: |-
        Thanks for sharing what you actually pay in Seattle! A maintainer will review your submission and turn it into a new reference data set, credited to your nickname and the month it was collected.

        **Ground rules**
        - Fill in what you **actually paid** (USD). Leave unknown items **blank**; the site shows them as "To be added". Please do not guess.
        - If you only know a combined total, put it in one field and say which items it covers in the notes at the end.
        - **This issue is public.** Do not include your real name, email, phone number, exact address or lease text.
  - type: input
    id: contributor
    attributes:
      label: Display name
      description: Shown on the site; a nickname or "anonymous student" is fine.
      placeholder: e.g. Anonymous student
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: Neighbourhood level only, no street number.
      placeholder: Downtown Seattle / Capitol Hill / Bellevue ...
    validations:
      required: true
  - type: input
    id: updated
    attributes:
      label: Month of the data
      description: "Format YYYY-MM: the month these amounts refer to."
      placeholder: 2026-11
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Living situation
      description: Unit type, roommates, lease length, car or not, in a sentence or two.
      placeholder: Studio, living alone, 12-month lease, no car
    validations:
      required: true
  - type: dropdown
    id: basis
    attributes:
      label: Where do the numbers come from
      description: Estimates are labelled separately on the site and never mixed with actual spending.
      options:
        - All amounts are what I actually paid
        - Some are estimates, explained in the notes
    validations:
      required: true
  - type: markdown
    attributes:
      value: |-
        ## Housing
        Rent, deposits, utilities, internet and other costs tied directly to where you live.
  - type: input
    id: rent
    attributes:
      label: Rent (USD)
      description: per month
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: application-fee
    attributes:
      label: Application fee (USD)
      description: one-time
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: deposit
    attributes:
      label: Deposit (USD)
      description: one-time
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: utilities
    attributes:
      label: Water, electricity and gas (USD)
      description: per month
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: internet
    attributes:
      label: Internet (USD)
      description: per month
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: renters-insurance
    attributes:
      label: Renters insurance (USD)
      description: per month
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: markdown
    attributes:
      value: |-
        ## Food and daily supplies
        Groceries, eating out and household supplies.
  - type: input
    id: groceries
    attributes:
      label: Groceries (USD)
      description: per month · food cost
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: daily-supplies
    attributes:
      label: Household supplies (USD)
      description: per month
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: dining-out
    attributes:
      label: Eating out (USD)
      description: per month
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: markdown
    attributes:
      value: |-
        ## Transportation
        Commuting, public transit and car-related costs.
  - type: input
    id: transit
    attributes:
      label: Public transit (USD)
      description: per month
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: car
    attributes:
      label: Car (insurance / gas / parking) (USD)
      description: per month
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: markdown
    attributes:
      value: |-
        ## Other
        Phone, health insurance, entertainment and other common expenses.
  - type: input
    id: phone
    attributes:
      label: Phone service (USD)
      description: per month
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: health
    attributes:
      label: Health insurance (USD)
      description: per month
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: leisure
    attributes:
      label: Entertainment and leisure (USD)
      description: per month
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: markdown
    attributes:
      value: |-
        ## First-move purchases
        Furniture and supplies bought once when moving into a new place.
  - type: input
    id: mattress
    attributes:
      label: Mattress (USD)
      description: one-time · Queen Size
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: bed-frame
    attributes:
      label: Bed frame (USD)
      description: one-time · Queen Size
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: wardrobe
    attributes:
      label: Wardrobe (USD)
      description: one-time · simple fabric wardrobe
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: desk
    attributes:
      label: Computer desk (USD)
      description: one-time
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: chair
    attributes:
      label: Ergonomic chair (USD)
      description: one-time
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: shelf
    attributes:
      label: Storage shelf (USD)
      description: one-time · simple
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: monitor
    attributes:
      label: Monitor (USD)
      description: one-time · Philips 4K
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: cookware
    attributes:
      label: Cookware (USD)
      description: one-time · one set
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: tableware
    attributes:
      label: Bowls and chopsticks (USD)
      description: one-time · 6 sets
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: air-fryer
    attributes:
      label: Air fryer (USD)
      description: one-time
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: rice-cooker
    attributes:
      label: Rice cooker (USD)
      description: one-time
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: kettle
    attributes:
      label: Electric kettle (USD)
      description: one-time
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: shower-head
    attributes:
      label: Shower head (USD)
      description: one-time
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: input
    id: fan
    attributes:
      label: Standing fan (USD)
      description: one-time
      placeholder: e.g. 100; leave blank if unknown
    validations:
      required: false
  - type: markdown
    attributes:
      value: "## Commute time"
  - type: input
    id: commute
    attributes:
      label: Commute time (minutes, one way)
      description: "Minutes one way from home to campus. Time is a cost too: the site shows it on its own line and does not add it to the dollar totals."
      placeholder: e.g. 3; leave blank if unknown
    validations:
      required: false
  - type: markdown
    attributes:
      value: |-
        ## Your advice
        Your own impressions of living here. They are subjective and every box may be left blank. Write one point per line.
  - type: textarea
    id: advice-positive
    attributes:
      label: Positives
      description: What you like about living here.
    validations:
      required: false
  - type: textarea
    id: advice-negative
    attributes:
      label: Negatives
      description: What is inconvenient or disappointing.
    validations:
      required: false
  - type: textarea
    id: advice-neutral
    attributes:
      label: Neutral observations
      description: Neither good nor bad, but worth knowing or a trade-off to be aware of.
    validations:
      required: false
  - type: markdown
    attributes:
      value: "## Notes and consent"
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Which items a combined total covers, which numbers are estimates and why, any other assumptions.
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Confirmation
      options:
        - label: I agree this data may be published on the site under the nickname above, and it contains no private personal information.
          required: true
