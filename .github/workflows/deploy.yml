name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 站点文案的多语言审计(@hagicode/hagi18n):缺文件、缺键、多余键、占位符不一致都会让它失败。
      - run: pnpm run i18n:check
      # 投稿表单由成本项生成,成本项改了而表单没重新生成会失败。
      - run: pnpm run issue-template -- --check
      - run: pnpm run build
        env:
          # HagiLight 页脚的构建信息;checkout 可能是分离 HEAD,显式给出。
          HAGILIGHT_BUILD_BRANCH: ${{ github.ref_name }}
          HAGILIGHT_BUILD_COMMIT: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
