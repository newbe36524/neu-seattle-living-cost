# 一位数据提供者的真实记录。新增一位同学 = 在本目录新增一个 .yaml 文件(文件名随意)。
# 本文件只放数字与引用;提供者名称、区域、情境说明和各条备注在 src/locales/<语言>/data.yml 的
# profiles.<id> 下(contributor、area、summary、notes)。
#
# 诚实原则:没提供的项目不要写,页面会自动显示「待补充」;不得估算或填充。
# entries 字段:
#   items   覆盖的项目 id(见 categories.yaml)。提供者只给合计时可列多个(合并项),金额只计一次,
#           同一条里的项目周期必须相同。
#   amount  美元;null 表示已知需要填写但尚无数字。
#   basis   reported(提供者所报,默认)或 estimate(参考价格估算,非实际支出,页面会标「估算」)。
#   备注    写在 data.yml 的 profiles.<id>.notes.<该条 items 的第一个项目 id>;estimate 条目没写备注时
#           显示通用的「估算(…非实际支出)」。
#
# 除金额外还有两个可选的非金额字段(没提供就不写,页面会显示「待补充」或不显示):
#   commuteMinutes  从住处到校园的单程通勤分钟数(时间也是成本)。
#   advice          提供者本人的主观建议,每条 { kind, id }:kind 为 positive(积极)/ negative(消极)/ neutral(中性),
#                   正文在 data.yml 的 profiles.<id>.advice.<id>。这是个人感受,不是统计结论。

