# 成本项定义:有哪些分类、哪些项目、周期是什么。与具体某个人无关,不含金额,也不含任何语言的文字。
# 分类名、项目名、说明在 src/locales/<语言>/data.yml 里,键是这里的 id(categories.<id>.title、items.<id>.label/hint)。
# 新增项目:在对应分类的 items 里加一行,再到各语言的 data.yml 补文字(npm run i18n:sync 可预演补键);新增分类同理。
# unit 取值:month(每月)、year(每年)、one-time(一次性)。
# 项目 id 一经使用请不要改名,各提供者的记录通过 id 引用它。

- id: housing
  items:
    - { id: rent, unit: month }
    - { id: application-fee, unit: one-time }
    - { id: deposit, unit: one-time }
    - { id: utilities, unit: month }
    - { id: internet, unit: month }

- id: food
  items:
    - { id: groceries, unit: month }
    - { id: daily-supplies, unit: month }
    - { id: dining-out, unit: month }

- id: transport
  items:
    - { id: transit, unit: month }
    - { id: car, unit: month }

- id: other
  items:
    - { id: phone, unit: month }
    - { id: health, unit: month }
    - { id: leisure, unit: month }

- id: setup
  items:
    - { id: mattress, unit: one-time }
    - { id: bed-frame, unit: one-time }
    - { id: wardrobe, unit: one-time }
    - { id: desk, unit: one-time }
    - { id: chair, unit: one-time }
    - { id: shelf, unit: one-time }
    - { id: monitor, unit: one-time }
    - { id: cookware, unit: one-time }
    - { id: tableware, unit: one-time }
    - { id: air-fryer, unit: one-time }
    - { id: rice-cooker, unit: one-time }
    - { id: kettle, unit: one-time }
    - { id: shower-head, unit: one-time }
    - { id: fan, unit: one-time }
