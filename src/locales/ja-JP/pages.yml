home:
  title: ホーム
  intro: ノースイースタン大学(Northeastern University)シアトルキャンパスの学生向けに、シアトルでの主な生活費をまとめ、入学前の予算づくりに役立てていただくためのサイトです。各データは学生一人ひとりの実体験で、地域と収集時期を明記しています。
  collected: "{{summary}}収集時期:{{updated}}。"
about:
  title: このサイトについて・データの出典
  intro: 本サイトは、ノースイースタン大学シアトルキャンパスの学生向けの生活費リファレンスです。現時点のデータと内容はすべて運営者個人の経験に基づくもので、公式情報ではなく、すべての人に当てはまるとは限りません。
  updateHeading: データの更新方法
  updateBody: すべてのデータはリポジトリの `src/data/` にある YAML ファイル(費用項目の定義が1ファイル、提供者ごとの記録が各1ファイル)で管理し、各言語の文言は `src/locales/` にあります。`main` ブランチにプッシュすると、GitHub Pages が自動で再ビルドして公開します。
  languagesHeading: 言語バージョン
  languagesBody: 本サイトは 10 言語で提供しています。原文は簡体字中国語で、ほかの言語は(AI の支援による)翻訳です。内容が異なる場合は簡体字中国語版が優先されます。金額は常に米ドルで表示します。
  futureHeading: 今後の予定
  futureBody: 今後、ほかの学生の経験や資料を追加する可能性があります。その際は各データに提供者を明記します。
