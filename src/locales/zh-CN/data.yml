# 成本项与提供者记录的文字。键与 src/data/ 里的 id 对应;金额、周期等事实留在 YAML 数据里,不在这里。
# profiles.<提供者 id>.notes 的键是该条记录 items 里的第一个项目 id;没有对应键的估算记录显示通用的 common.estimateNote。
