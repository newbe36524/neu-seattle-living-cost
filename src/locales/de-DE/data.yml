profiles:
  author-downtown:
    contributor: Seitenautor
    area: Downtown Seattle
    summary: "Wohnt in Downtown Seattle."
    notes:
      application-fee: Einmalig beim ersten Einzug gezahlt.
      transit: "Laut der Person betragen öffentlicher Nahverkehr und Fahrzeug zusammen $10 pro Monat."
      renters-insurance: "Die Hausratversicherung, die zur gemieteten Wohnung selbst gehört."
      utilities: "Ungefährer Wert."
      groceries: "Ungefährer Wert. Gesamtsumme aus Lebensmitteln und Haushaltswaren; die Person hat sie nicht einzeln erfasst."
      health: "Die Hochschule schreibt eine Krankenversicherung vor, deshalb wird sie hier vorerst nicht mitgezählt."
      dining-out: Alle Mahlzeiten werden selbst gekocht, es wird nicht auswärts gegessen; die Lebensmittelausgaben sind im obigen Sammelposten bereits enthalten.
      mattress: "{{estimate}}: 10-Zoll-Queen-Matratze aus Memory-Schaum, übliche Preise etwa $145–240"
      bed-frame: "{{estimate}}: üblicher Preis für ein Plattform-Bettgestell aus Metall"
      wardrobe: "{{estimate}}: einfacher Stoffkleiderschrank, übliche Preise etwa $25–30"
      monitor: "{{estimate}}: 27 Zoll, 4K; vergleichbare Philips-Modelle kosten üblicherweise etwa $200–270"
    advice:
      close-to-campus:
        title: "Nur Minuten bis zum Campus"
        text: "Sehr nah am Campus: Jeder Ort auf dem Campus ist in nur 3 Minuten erreichbar, daher bleibt genug Zeit für fast das gesamte Campusleben und alle Lehrveranstaltungen."
      time-saved:
        title: "Keine Pendelzeit"
        text: "Kein Zeitaufwand fürs Pendeln: Im Vergleich zu einer weiter entfernten Wohnung spart man jeden Tag mindestens eine Stunde Fahrzeit."
      city-events:
        title: "Viele Stadtevents"
        text: "Wer in Downtown wohnt, kann an vielen Community-Veranstaltungen der Stadt teilnehmen, denn viele finden ganz in der Nähe statt: AI House, die Space Needle und mehrere Museen sind nicht weit entfernt und allesamt sehenswert."
      far-supermarkets:
        title: "Große Supermärkte sind weit"
        text: "Große Supermärkte sind recht weit entfernt, außer Target. Whole Foods ist ebenfalls nah, aber vergleichsweise teuer; Trader Joe's und Walmart liegen weiter weg. Bei Walmart bestellt die Person in der Regel nur online und lässt sich liefern."
