profiles:
  author-downtown:
    contributor: Auteur du site
    area: Downtown Seattle
    summary: "Habite à Downtown Seattle."
    notes:
      application-fee: Payés une seule fois lors de la première installation.
      transit: "Le contributeur indique $10 par mois pour les transports en commun et le véhicule réunis."
      renters-insurance: "L'assurance habitation associée à l'appartement loué lui-même."
      utilities: "Montant approximatif."
      groceries: "Montant approximatif. Total des courses et des produits du quotidien ; le contributeur ne les a pas notés séparément."
      health: "L'université impose l'achat d'une assurance santé ; elle n'est donc pas comptée ici pour le moment."
      dining-out: Tous les repas sont faits maison, aucun repas au restaurant ; les dépenses alimentaires sont déjà comprises dans le poste groupé ci-dessus.
      mattress: "{{estimate}} : matelas Queen en mousse à mémoire de forme de 10 pouces, prix courants d'environ $145–240"
      bed-frame: "{{estimate}} : prix courant d'un cadre de lit plateforme en métal"
      wardrobe: "{{estimate}} : armoire simple en tissu, prix courants d'environ $25–30"
      monitor: "{{estimate}} : 27 pouces 4K ; les modèles Philips comparables coûtent couramment environ $200–270"
    advice:
      close-to-campus: "Très proche du campus : il suffit de 3 minutes pour rejoindre n'importe quel endroit du campus, d'où largement le temps de profiter de presque toute la vie du campus et de tous les cours."
      time-saved: "Aucun temps perdu en trajet : par rapport à un logement plus éloigné, on économise au moins une heure de transport chaque jour."
      far-supermarkets: "Les grands supermarchés sont plutôt loin, sauf Target. Whole Foods est aussi proche, mais ses prix sont relativement élevés ; Trader Joe's et Walmart sont plus éloignés. Pour Walmart, le contributeur commande généralement en ligne et se fait livrer."
