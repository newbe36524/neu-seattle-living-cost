home:
  title: Главная
  intro: "Справочник для студентов кампуса Northeastern University в Сиэтле: основные расходы на жизнь в Сиэтле, чтобы вы могли составить бюджет до начала учёбы. Каждый набор данных — реальный опыт одного студента с указанием района и времени сбора."
  collected: "{{summary}} Собрано: {{updated}}."
costs:
  title: Подробности расходов
  intro: Суммы указаны в долларах США. Статьи, которые ещё не собраны, отмечены как «будет добавлено». Каждая запись отражает реальную ситуацию одного участника.
about:
  title: О сайте и источниках данных
  intro: Этот сайт — справочник по стоимости жилья и жизни для студентов кампуса Northeastern University в Сиэтле. Все данные и материалы пока основаны на личном опыте автора сайта; это не официальная информация, и она может подойти не всем.
  updateHeading: Как обновляются данные
  updateBody: Все данные хранятся в YAML-файлах в каталоге `src/data/` репозитория (один файл с описанием статей расходов и по одному файлу на каждого участника), а тексты на разных языках лежат в `src/locales/`. После отправки в ветку `main` GitHub Pages автоматически пересобирает и публикует сайт.
  languagesHeading: Языковые версии
  languagesBody: Сайт доступен на 10 языках. Оригинал — на упрощённом китайском; остальные языки — переводы (выполнены с помощью ИИ), и при расхождениях приоритет имеет версия на упрощённом китайском. Суммы всегда показываются в долларах США.
  futureHeading: Планы на будущее
  futureBody: Позже могут быть добавлены опыт и данные других студентов, и для каждой записи будет указан её автор.
