profiles:
  author-downtown:
    contributor: Автор сайта
    area: Downtown Seattle
    summary: "Живёт в Downtown Seattle."
    notes:
      application-fee: Платится один раз при первом заселении.
      transit: "Участник сообщает, что общественный транспорт и автомобиль вместе обходятся в $10 в месяц."
      renters-insurance: "Страховка жилья, которая идёт вместе с самой арендуемой квартирой."
      utilities: "Примерная сумма."
      groceries: "Примерная сумма. Общий итог по продуктам и предметам быта; участник не вёл их учёт по отдельности."
      health: "Университет требует обязательной медицинской страховки, поэтому пока она здесь не учитывается."
      dining-out: Все блюда готовит дома, в кафе и ресторанах не ест; расходы на еду уже входят в объединённую статью выше.
      mattress: "{{estimate}}: 10-дюймовый матрас Queen из пены с эффектом памяти, обычная цена около $145–240"
      bed-frame: "{{estimate}}: обычная цена металлического каркаса кровати-платформы"
      wardrobe: "{{estimate}}: простой тканевый шкаф, обычная цена около $25–30"
      monitor: "{{estimate}}: 27 дюймов 4K; сопоставимые модели Philips обычно стоят около $200–270"
    advice:
      close-to-campus: "Очень близко к кампусу: до любой точки кампуса всего 3 минуты, поэтому хватает времени почти на всю жизнь кампуса и на все занятия."
      time-saved: "Нет затрат времени на дорогу: по сравнению с жильём подальше экономится не меньше часа на дорогу каждый день."
      far-supermarkets: "Крупные супермаркеты довольно далеко, кроме Target. Whole Foods тоже рядом, но цены там относительно высокие; Trader Joe's и Walmart дальше. В Walmart автор обычно заказывает только онлайн, с доставкой на дом."
