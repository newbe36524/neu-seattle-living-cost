profiles:
  author-downtown:
    contributor: Автор сайта
    area: Downtown Seattle
    summary: Живёт в Downtown Seattle; ежемесячные расходы на транспорт равны 0.
    notes:
      application-fee: Платится один раз при первом заселении.
      transit: Участник сообщает, что ежемесячные расходы на транспорт равны 0.
      utilities: Примерная сумма. Общий итог по коммунальным услугам, интернету, продуктам и предметам быта; участник не вёл их учёт по отдельности.
      dining-out: Все блюда готовит дома, в кафе и ресторанах не ест; расходы на еду уже входят в объединённую статью выше.
      mattress: "{{estimate}}: 10-дюймовый матрас Queen из пены с эффектом памяти, обычная цена около $145–240"
      bed-frame: "{{estimate}}: обычная цена металлического каркаса кровати-платформы"
      wardrobe: "{{estimate}}: простой тканевый шкаф, обычная цена около $25–30"
      monitor: "{{estimate}}: 27 дюймов 4K; сопоставимые модели Philips обычно стоят около $200–270"
