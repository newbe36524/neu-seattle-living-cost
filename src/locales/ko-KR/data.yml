profiles:
  author-downtown:
    contributor: 사이트 운영자
    area: Downtown Seattle
    summary: "Downtown Seattle에 거주합니다."
    notes:
      application-fee: 처음 입주할 때 1회 납부.
      transit: "제공자 말로는 대중교통과 차량 비용이 합쳐서 월 $10입니다."
      renters-insurance: "임차한 아파트 자체에 포함된 주택 보험입니다."
      utilities: "대략적인 금액."
      groceries: "대략적인 금액. 식비와 생필품의 합계이며 제공자가 항목별로 기록하지 않았습니다."
      health: "학교에서 의료보험 가입을 의무화하고 있어 여기서는 당분간 포함하지 않습니다."
      dining-out: 세 끼 모두 직접 해 먹고 외식은 하지 않음. 식비는 위의 묶음 항목에 이미 포함되어 있습니다.
      mattress: "{{estimate}}: 10인치 Queen 메모리폼 매트리스, 일반적인 가격대는 약 $145–240"
      bed-frame: "{{estimate}}: 금속 플랫폼 침대 프레임의 일반적인 가격대"
      wardrobe: "{{estimate}}: 간이 천 옷장, 일반적인 가격대는 약 $25–30"
      monitor: "{{estimate}}: 27인치 4K, 필립스 동급 모델의 일반적인 가격대는 약 $200–270"
    advice:
      close-to-campus:
        title: "캠퍼스가 코앞"
        text: "캠퍼스와 매우 가까워 캠퍼스 어디든 단 3분이면 도착하므로, 거의 모든 캠퍼스 생활과 모든 수업에 참여할 시간이 충분합니다."
      time-saved:
        title: "통학 시간 절약"
        text: "통학에 드는 시간 비용이 없습니다. 멀리 사는 경우와 비교하면 매일 최소 한 시간의 이동 시간을 아낄 수 있습니다."
      city-events:
        title: "도시 행사가 풍부"
        text: "다운타운에 살면 시내의 다양한 커뮤니티 행사에 참여할 수 있습니다. 가까운 곳에서 열리는 행사가 많고, AI House, Space Needle, 여러 박물관도 멀지 않아 모두 방문할 만합니다."
      far-supermarkets:
        title: "대형 마트는 먼 편"
        text: "대형 마트는 Target을 제외하면 다소 멉니다. Whole Foods도 가깝지만 가격이 상대적으로 높고, Trader Joe's와 Walmart는 더 멉니다. Walmart는 보통 온라인으로 주문해 집으로 배송받습니다."
