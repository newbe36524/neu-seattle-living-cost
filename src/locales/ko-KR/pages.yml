home:
  title: 홈
  intro: 노스이스턴 대학교(Northeastern University) 시애틀 캠퍼스 학생을 위해 시애틀 생활의 주요 지출을 정리해, 입학 전에 예산을 세우는 데 도움을 드립니다. 각 데이터는 학생 한 명의 실제 경험이며, 지역과 수집 시점을 함께 표기합니다.
  collected: "{{summary}} 수집 시점: {{updated}}."
about:
  title: 소개 및 데이터 출처
  intro: 이 사이트는 노스이스턴 대학교 시애틀 캠퍼스 학생을 위한 주거 비용 참고 자료입니다. 현재 모든 데이터와 내용은 사이트 운영자의 개인 경험에서 나온 것으로, 공식 정보가 아니며 모든 사람에게 해당된다고 보장할 수 없습니다.
  updateHeading: 데이터 업데이트 방법
  updateBody: 모든 데이터는 저장소의 `src/data/` 아래 YAML 파일(비용 항목 정의 파일 1개, 제공자별 기록 파일 각 1개)로 관리하며, 언어별 문구는 `src/locales/`에 있습니다. `main` 브랜치에 푸시하면 GitHub Pages가 자동으로 다시 빌드하여 배포합니다.
  languagesHeading: 언어 버전
  languagesBody: 이 사이트는 10개 언어로 제공됩니다. 간체 중국어가 원문이며, 다른 언어는 (AI의 도움을 받은) 번역본입니다. 내용이 다를 경우 간체 중국어 버전을 따릅니다. 금액은 항상 미국 달러로 표시됩니다.
  futureHeading: 향후 계획
  futureBody: 앞으로 다른 학생들의 경험과 자료가 추가될 수 있으며, 각 데이터에는 제공자가 표기됩니다.
