# @hagicode/hagi18n 配置:站点自己的多语言文案由它审计与同步(运行时加载在 src/i18n/)。
# 以简体中文为基准语言,其余 9 种语言必须与它的文件、键、占位符完全一致。
#   pnpm run i18n:check   审计(缺文件/缺键/多余键/占位符不一致),CI 与构建前都会跑
#   pnpm run i18n:sync    预演:把基准语言新增的键补到其他语言(加 -- --write 才写入)
localesRoot: src/locales
repoRoot: .
baseLocale: zh-CN
targetLocales:
  - zh-Hant
  - en-US
  - ja-JP
  - ko-KR
  - de-DE
  - fr-FR
  - es-ES
  - pt-BR
  - ru-RU

# 刻意与基准语言相同的值(专有名词、不翻译的规格),按 文件 → 键路径 列出。
# 繁体中文、日语与简体中文共用的汉字词(如「每月」「押金」)也在这里列出。
auditIdenticalAllowlist:
  common.yml:
    - units.month
    - units.year
    - units.one-time
    - status.estimate
    - listSeparator
    - advice.neutral
  ledger.yml:
    - picker.figure
    - group.monthlySuffix
    - row.unitMonth
    - row.unitYear
    - row.unitOneTime
    - row.perMonth
    - settle.onceNote
    - settle.estimateNote
  charts.yml:
    - share.tooltip
  data.yml:
    - categories.housing.title
    - categories.transport.title
    - categories.other.title
    - items.rent.label
    - items.deposit.label
    - items.groceries.hint
    - items.daily-supplies.label
    - items.bed-frame.label
    - items.shelf.label
    - items.tableware.label
    - items.tableware.hint
    - items.mattress.hint
    - items.bed-frame.hint
    - profiles.author-downtown.area
    - profiles.author-downtown.summary
